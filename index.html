<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J28.2 Formatter</title>
</head>
<body>
  <main>
    <h1>J28.2 Formatter</h1>

    <form id="formatter-form">
      <fieldset>
        <legend>Message setup</legend>

        <p>
          <label for="form-select">Form</label>
          <select id="form-select"></select>
        </p>

        <p>
          <label for="platform-select">Platform</label>
          <select id="platform-select"></select>
        </p>

        <p>
          <label for="mode-select">Line combination</label>
          <select id="mode-select">
            <option value="lineBreak">Line Break</option>
            <option value="singleSlash">Single slash</option>
            <option value="dash">Dash</option>
          </select>
        </p>

        <p>
          <label for="prefix-select">Passage prefix</label>
          <select id="prefix-select">
            <option value="indexSpace">Index with space</option>
            <option value="indexPeriod">Index with period</option>
            <option value="indexDash">Index with dash</option>
            <option value="alphaSpace">Alphabetical with space</option>
            <option value="alphaPeriod">Alphabetical with period</option>
            <option value="alphaDash">Alphabetical with dash</option>
            <option value="none">None</option>
          </select>
        </p>

      </fieldset>

      <fieldset>
        <legend id="passage-fields-heading">Form passages</legend>
        <div id="passage-fields"></div>
      </fieldset>
    </form>

    <section aria-labelledby="output-heading">
      <h2 id="output-heading">Formatted message</h2>
      <p>
        <label for="output-text">Copyable output</label><br>
        <textarea id="output-text" readonly spellcheck="false"></textarea>
      </p>
      <button id="copy-button" type="button">Copy message</button>

      <p>Total characters: <span id="total-characters">0</span></p>

      <h3 id="cockpit-display-heading">Cockpit display</h3>
      <p id="cockpit-display-summary"></p>
      <pre id="cockpit-display"></pre>
    </section>
  </main>

  <script>
    // Project-specific definitions live here. Adding a platform or form should
    // only require adding another entry to one of these registries.
    const PLATFORM_DATA = [
      {
        label: "F-16",
        charsPerLine: 40,
        screenLines: 12,
        supportsDoubleSlash: true
      },
      {
        label: "F-35",
        charsPerLine: 32,
        screenLines: 6,
        supportsDoubleSlash: false
      },
      {
        label: "F-15",
        charsPerLine: 24,
        screenLines: 10,
        supportsDoubleSlash: true
      },
      {
        label: "A-10",
        charsPerLine: 16,
        screenLines: 5,
        supportsDoubleSlash: true
      }
    ];

    const FORM_DATA = [
      {
        label: "Marshall",
        passages: [
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si"
        ]
      },
      {
        label: "DCA",
        passages: [
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si"
        ]
      }
    ];

    const state = {
      tabID: 0,
      tabs: [
        {
          formId: 0,
          platformId: 0,
          modeId: "lineBreak",
          prefixId: "none",
          values: Object.fromEntries(FORM_DATA.map((form, formId) => [
            formId,
            Array(form.passages.length).fill("")
          ]))
        }
      ],
      get activeTab() {
        return this.tabs[this.tabID];
      },
      get formId() {
        return this.activeTab.formId;
      },
      set formId(value) {
        this.activeTab.formId = value;
      },
      get platformId() {
        return this.activeTab.platformId;
      },
      set platformId(value) {
        this.activeTab.platformId = value;
      },
      get modeId() {
        return this.activeTab.modeId;
      },
      set modeId(value) {
        this.activeTab.modeId = value;
      },
      get prefixId() {
        return this.activeTab.prefixId;
      },
      set prefixId(value) {
        this.activeTab.prefixId = value;
      },
      get values() {
        return this.activeTab.values;
      },
      set values(value) {
        this.activeTab.values = value;
      }
    };

    const elements = {
      formSelect: document.querySelector("#form-select"),
      platformSelect: document.querySelector("#platform-select"),
      modeSelect: document.querySelector("#mode-select"),
      prefixSelect: document.querySelector("#prefix-select"),
      passageFields: document.querySelector("#passage-fields"),
      passageFieldsHeading: document.querySelector("#passage-fields-heading"),
      outputText: document.querySelector("#output-text"),
      copyButton: document.querySelector("#copy-button"),
      totalCharacters: document.querySelector("#total-characters"),
      cockpitDisplaySummary: document.querySelector("#cockpit-display-summary"),
      cockpitDisplay: document.querySelector("#cockpit-display")
    };

    function populateSelect(select, definitions) {
      Object.entries(definitions).forEach(([id, definition]) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = definition.label;
        select.append(option);
      });
    }

    function uppercase(value) {
      return value.toLocaleUpperCase("en-US");
    }

    function lettersForIndex(index) {
      let number = index + 1;
      let result = "";
      while (number > 0) {
        number -= 1;
        result = String.fromCharCode(65 + (number % 26)) + result;
        number = Math.floor(number / 26);
      }
      return result;
    }

    function passagePrefix(prefixId, passageIndex) {
      const number = String(passageIndex + 1);
      const letter = lettersForIndex(passageIndex);

      switch (prefixId) {
        case "indexSpace": return `${number} `;
        case "indexPeriod": return `${number}.`;
        case "indexDash": return `${number}-`;
        case "alphaSpace": return `${letter} `;
        case "alphaPeriod": return `${letter}.`;
        case "alphaDash": return `${letter}-`;
        default: return "";
      }
    }

    function formatPassage(value, index) {
      const platform = PLATFORM_DATA[state.platformId];
      const text = uppercase(value.trim());
      if (!text) return null;

      const formatted = `${passagePrefix(state.prefixId, index)}${text}`;
      if (platform.supportsDoubleSlash || !value.includes("//")) return formatted;

      const sections = formatted.split("//");
      return sections.map((section, sectionIndex) => {
        const isFinalSection = sectionIndex === sections.length - 1;
        return isFinalSection ? section : padToWidth(section, platform.charsPerLine);
      }).join("");
    }

    function padToWidth(value, width) {
      const padding = width - (value.length % width || width);
      return padding === width ? value : `${value}${" ".repeat(padding)}`;
    }

    function combinePassages(passages, platform) {
      if (passages.length === 0) return "";

      if (state.modeId === "lineBreak") {
        if (platform.supportsDoubleSlash) {
          return passages.join("//");
        }

        return passages.map((passage, index) => {
          const isFinalPassage = index === passages.length - 1;
          if (isFinalPassage) return passage;
          return padToWidth(passage, platform.charsPerLine);
        }).join("");
      }

      const suffix = state.modeId === "singleSlash" ? "/" : "-";
      return passages.map((passage, index) => {
        const isFinalPassage = index === passages.length - 1;
        return isFinalPassage ? passage : `${passage}${suffix}`;
      }).join("");
    }

    function wrapDisplayText(text, width) {
      if (!text) return [""];

      const displayLines = [];
      for (let index = 0; index < text.length; index += width) {
        displayLines.push(text.slice(index, index + width));
      }
      return displayLines;
    }

    function renderCockpitDisplay(formattedMessage) {
      const platform = PLATFORM_DATA[state.platformId];
      const displayLines = platform.supportsDoubleSlash
        ? formattedMessage.split("//").flatMap((passage) => wrapDisplayText(passage, platform.charsPerLine))
        : wrapDisplayText(formattedMessage, platform.charsPerLine);
      const scrollLines = Math.max(0, displayLines.length - platform.screenLines);

      elements.cockpitDisplay.textContent = displayLines.join("\n");
      elements.cockpitDisplaySummary.textContent = `${displayLines.length} display lines; ${platform.screenLines} visible without scrolling${scrollLines ? `; ${scrollLines} require scrolling.` : "."}`;
    }

    function formatMessage() {
      const platform = PLATFORM_DATA[state.platformId];
      const passages = state.values[state.formId]
        .map((value, index) => formatPassage(value, index))
        .filter(Boolean);
      passages.push("EOM");

      return combinePassages(passages, platform);
    }

    function renderPassageFields() {
      const form = FORM_DATA[state.formId];
      elements.passageFields.replaceChildren();
      elements.passageFieldsHeading.textContent = "Data Input";

      form.passages.forEach((passage, index) => {
        const passageNumber = index + 1;
        const passageLabel = `${passageNumber}. `;
        const passageId = `form-${state.formId}-passage-${passageNumber}`;
        const wrapper = document.createElement("p");
        const label = document.createElement("label");
        const input = document.createElement("input");
        const description = document.createElement("small");

        input.id = passageId;
        input.type = "text";
        input.autocomplete = "off";
        input.spellcheck = false;
        input.value = state.values[state.formId][index];
        input.placeholder = `Enter ${passageLabel.toLowerCase()}`;
        input.addEventListener("input", (event) => {
          state.values[state.formId][index] = event.target.value;
          renderFormattedMessage();
        });

        label.htmlFor = passageId;
        label.textContent = passageLabel;
        description.textContent = passage;

        wrapper.append(label, description, input);
        elements.passageFields.append(wrapper);
      });
    }

    function renderFormattedMessage() {
      const formatted = formatMessage();
      elements.outputText.value = formatted;
      elements.totalCharacters.textContent = formatted.length;
      renderCockpitDisplay(formatted);
    }

    function renderSetup() {
      renderPassageFields();
      renderFormattedMessage();
    }

    elements.formSelect.addEventListener("change", (event) => {
      state.formId = Number(event.target.value);
      renderSetup();
    });

    elements.platformSelect.addEventListener("change", (event) => {
      state.platformId = Number(event.target.value);
      renderSetup();
    });

    elements.modeSelect.addEventListener("change", (event) => {
      state.modeId = event.target.value;
      renderFormattedMessage();
    });

    elements.prefixSelect.addEventListener("change", (event) => {
      state.prefixId = event.target.value;
      renderFormattedMessage();
    });

    elements.copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(elements.outputText.value);
        elements.copyButton.textContent = "Copied";
      } catch (error) {
        elements.outputText.focus();
        elements.outputText.select();
        elements.copyButton.textContent = document.execCommand("copy") ? "Copied" : "Select and copy";
      }
      window.setTimeout(() => {elements.copyButton.textContent = "Copy message";}, 1600);
    });

    populateSelect(elements.formSelect, FORM_DATA);
    populateSelect(elements.platformSelect, PLATFORM_DATA);
    renderSetup();
  </script>
</body>
</html>
