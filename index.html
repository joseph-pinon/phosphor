<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phosphor — J28.2 Formatter</title>
  <style>
    :root {
      color-scheme: light;
      --mono-font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --background: #f4f4f4;
      --surface: #ffffff;
      --surface-muted: #eaeaea;
      --text: #141414;
      --muted: #6b6b6b;
      --border: #cccccc;
      --accent: #1f1f1f;
      --accent-text: #ffffff;
      --focus: #4d4d4d;
      --issue-error: #c00000;
      --cockpit: #0a0a0a;
      --cockpit-text: #b8ffb8;
      --sticky-header-height: 0px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #121212;
      --surface: #1b1b1b;
      --surface-muted: #262626;
      --text: #f2f2f2;
      --muted: #a9a9a9;
      --border: #454545;
      --accent: #ededed;
      --accent-text: #121212;
      --focus: #d6d6d6;
      --issue-error: #ff6b6b;
      --cockpit: #000000;
      --cockpit-text: #a8f5a8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: calc(var(--sticky-header-height) + 0.75rem);
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: var(--mono-font);
      font-size: 1rem;
      line-height: 1.5;
    }

    button,
    select,
    textarea {
      color: inherit;
      font: inherit;
    }

    button,
    select,
    textarea,
    .settings-panel,
    .data-panel,
    .output-panel {
      border: 1px solid var(--border);
      border-radius: 0.25rem;
    }

    button {
      min-height: 2.5rem;
      padding: 0.45rem 0.8rem;
      background: var(--surface-muted);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    #output-text:focus-visible,
    #cockpit-display:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      box-shadow: inset 0 -1px var(--border);
      font-family: var(--mono-font);
      font-variant-ligatures: none;
    }

    .header-top,
    .tab-bar,
    main {
      width: min(75rem, calc(100% - 2rem));
      margin-inline: auto;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-block: 0.5rem;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3 {
      font-size: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }

    .brand-glyph {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      flex: none;
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      background: var(--surface-muted);
      color: var(--accent);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.08em;
      text-indent: 0.08em;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.15;
    }

    .brand-name {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--text);
    }

    .brand-tagline {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 34rem) {
      .brand-name {
        font-size: 1.15rem;
        letter-spacing: 0.16em;
      }

      .brand-tagline {
        font-size: 0.65rem;
      }
    }

    .tab-bar,
    #tab-list,
    .tab-item {
      display: flex;
      align-items: center;
    }

    .tab-bar {
      gap: 0.5rem;
      align-items: flex-end;
      padding-bottom: 0;
    }

    #tab-list {
      gap: 0.3rem;
      min-width: 0;
      overflow-x: auto;
      padding: 0.25rem 0.25rem 0;
    }

    .tab-item {
      flex: none;
      padding-right: 0.25rem;
      border: 1px solid var(--border);
      border-radius: 0.3rem 0.3rem 0 0;
      color: var(--muted);
      background: var(--surface-muted);
    }

    .tab-item:has([aria-selected="true"]) {
      border-bottom-color: var(--background);
      color: var(--text);
      background: var(--background);
    }

    .tab-button {
      border: 0;
      border-radius: 0.25rem;
      background: transparent;
      white-space: nowrap;
      padding: 0.4rem 0.9rem;
      max-width: 16rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-name-input {
      width: 12rem;
      min-width: 0;
      margin: 0.3rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--accent);
      border-radius: 0.2rem;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
    }

    .tab-name-input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .delete-tab-dialog {
      width: min(24rem, calc(100% - 2rem));
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1rem 2.5rem #0008;
    }

    .delete-tab-dialog::backdrop {
      background: #0009;
    }

    .delete-tab-dialog form {
      padding: 1rem;
    }

    .delete-tab-dialog h2 {
      margin-bottom: 0.5rem;
    }

    .delete-tab-dialog p {
      margin-bottom: 1rem;
      color: var(--muted);
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    #confirm-delete-tab {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
    }

    .tab-button[aria-selected="true"] {
      color: var(--accent);
      font-weight: 650;
    }

    .close-tab {
      min-width: 1.5rem;
      height: 1.5rem;
      padding: 0;
      border: 0;
      border-radius: 0.2rem;
      background: transparent;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .tab-item:hover .close-tab,
    .tab-item:focus-within .close-tab {
      opacity: 1;
    }

    .close-tab:hover {
      color: var(--text);
    }

    #add-tab {
      flex: none;
      width: 2.1rem;
      height: 2.1rem;
      padding: 0;
      border: 0;
      border-radius: 0.25rem;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      font-weight: 400;
      line-height: 1;
    }

    #add-tab:hover {
      color: var(--text);
    }

    @media (prefers-reduced-motion: reduce) {
      .close-tab {
        transition: none;
      }
    }

    #theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      width: 2rem;
      min-height: 2rem;
      height: 2rem;
      padding: 0.4rem;
      border-radius: 0.25rem;
      background: var(--surface-muted);
    }

    #theme-toggle::before {
      content: none;
    }

    #theme-toggle svg {
      position: relative;
      z-index: 1;
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      color: var(--muted);
    }

    :root:not([data-theme="dark"]) .sun-icon,
    :root[data-theme="dark"] .moon-icon {
      color: var(--accent) !important;
    }

    :root:not([data-theme="dark"]) .moon-icon,
    :root[data-theme="dark"] .sun-icon {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #theme-toggle::before {
        transition: none;
      }
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(20rem, 0.8fr);
      gap: 1rem;
      padding-block: 0.75rem 1rem;
    }

    .input-column,
    .settings-panel,
    .data-panel,
    .output-panel {
      min-width: 0;
    }

    .settings-panel,
    .data-panel,
    .output-panel {
      margin: 0 0 0.75rem;
      padding: 0.85rem;
      border-radius: 0.4rem;
      background: var(--surface);
    }

    .settings-panel h2,
    .data-panel h2,
    .output-panel h2 {
      margin-top: 0;
      margin-bottom: 0.75rem;
    }

    .output-panel {
      position: sticky;
      top: calc(var(--sticky-header-height) + 0.75rem);
      align-self: start;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .setup-grid p,
    .passage-field {
      margin-bottom: 0;
    }

    label,
    small {
      display: block;
    }

    label {
      margin-bottom: 0.25rem;
      font-weight: 650;
    }

    select,
    textarea {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border-color: var(--border);
      background: var(--surface);
    }

    #passage-fields {
      display: grid;
      gap: 0.75rem;
    }

    .passage-field label {
      margin-bottom: 0.25rem;
      font-size: 1rem;
      font-weight: 600;
    }

    .passage-field textarea {
      min-height: calc(2.5rem + 2px);
      overflow-y: hidden;
      resize: none;
      font-size: 1rem;
    }

    #output-text {
      display: block;
      width: 100%;
      margin-bottom: 0.5rem;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      white-space: break-spaces;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    .issue-illegal-character {
      text-decoration-line: underline;
      text-decoration-style: wavy;
      text-decoration-color: var(--issue-error);
      text-decoration-skip-ink: none;
      text-underline-offset: 0.12em;
    }

    .issue-unintentional-line-split {
      color: var(--issue-error);
    }

    #copy-button {
      flex: none;
      margin-bottom: 0;
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .output-header h2 {
      margin-bottom: 0;
    }

    .message-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .stat {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      background: var(--surface-muted);
      text-align: center;
      white-space: nowrap;
    }

    .stat-value {
      display: inline;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      display: inline;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .issue-summary {
      display: grid;
      gap: 0.35rem;
      margin: 0 0 0.5rem;
      padding: 0;
      font-size: 0.85rem;
      list-style: none;
    }

    .issue-summary li {
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--issue-error);
      border-radius: 0.25rem;
      background: var(--surface);
      color: var(--issue-error);
    }

    .issue-summary[hidden] {
      display: none;
    }

    .cockpit-viewport {
      max-width: 100%;
      overflow-x: auto;
      padding: 0.2rem;
    }

    .cockpit-frame {
      position: relative;
      width: max-content;
      margin-inline: auto;
      padding: 0.65rem;
      border: 1px solid #606060;
      border-radius: 0.2rem;
      background: #2c2c2c;
      box-shadow: 0 0.2rem 0.45rem #0005;
    }

    .cockpit-frame::before {
      content: none;
    }

    .cockpit-frame::after {
      content: none;
    }

    .cockpit-frame:has(#cockpit-display:focus-visible) {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    #cockpit-display-heading {
      margin: 0.75rem 0;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    #cockpit-display {
      --chars-per-line: 40;
      --screen-lines: 12;
      position: relative;
      z-index: 1;
      width: calc((var(--chars-per-line) * 1ch) + 1.6rem);
      height: calc((var(--screen-lines) * 1.5rem) + 1.6rem);
      margin: 0;
      overflow: auto;
      padding: 0.8rem;
      border: 1px solid #090909;
      border-radius: 0.08rem;
      background: var(--cockpit);
      color: var(--cockpit-text);
      font: 1rem/1.5rem ui-monospace, SFMono-Regular, Consolas, monospace;
      box-shadow: inset 0 0 0 1px #444444;
      scrollbar-color: #606060 #090909;
      text-shadow: 0 0 0.18rem #a8f5a84d;
      white-space: pre;
    }

    .harvestable-coordinate {
      color: #59b8ff;
      text-decoration: underline;
      text-decoration-color: currentColor;
      text-decoration-thickness: 0.1em;
      text-underline-offset: 0.12em;
      text-decoration-skip-ink: none;
      text-shadow: 0 0 0.3rem #59b8ff88;
    }

    @media (max-width: 48rem) {
      main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 34rem) {
      .settings-panel,
      .data-panel,
      .output-panel {
        padding: 0.75rem;
      }

      .header-top {
        align-items: flex-start;
      }

      .setup-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true">//</span>
        <span class="brand-text">
          <span class="brand-name">PHOSPHOR</span>
          <span class="brand-tagline">J28.2 Message Formatter</span>
        </span>
      </div>
      <button id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/></svg>
      </button>
    </div>
    <nav class="tab-bar" aria-label="Messages">
      <div id="tab-list" role="tablist" aria-label="Message tabs"></div>
      <button id="add-tab" type="button" aria-label="Add message tab" title="Add message tab">+</button>
    </nav>
  </header>

  <main id="formatter-workspace" role="tabpanel" aria-labelledby="message-tab-0">

    <div id="formatter-form" class="input-column">
      <section class="settings-panel" aria-labelledby="settings-heading">
        <h2 id="settings-heading">Setup</h2>
        <div class="setup-grid">
          <p>
            <label for="form-select">Form</label>
            <select id="form-select"></select>
          </p>

          <p>
            <label for="platform-select">Platform</label>
            <select id="platform-select"></select>
          </p>

          <p>
            <label for="mode-select">Line combination</label>
            <select id="mode-select">
              <option value="lineBreak">Line Break</option>
              <option value="singleSlash">Single slash</option>
              <option value="dash">Dash</option>
            </select>
          </p>

          <p>
            <label for="prefix-select">Passage prefix</label>
            <select id="prefix-select">
              <option value="indexSpace">Index with space</option>
              <option value="indexPeriod">Index with period</option>
              <option value="indexDash">Index with dash</option>
              <option value="alphaSpace">Alphabetical with space</option>
              <option value="alphaPeriod">Alphabetical with period</option>
              <option value="alphaDash">Alphabetical with dash</option>
              <option value="none">None</option>
            </select>
          </p>
        </div>
      </section>

      <section class="data-panel" aria-labelledby="passage-fields-heading">
        <h2 id="passage-fields-heading">Input</h2>
        <div id="passage-fields"></div>
      </section>
    </div>

    <section class="output-panel" aria-labelledby="output-heading">
      <div class="output-header">
        <h2 id="output-heading">Output</h2>
        <button id="copy-button" type="button">Copy message</button>
      </div>
      <div id="output-text" role="textbox" aria-label="Output" aria-readonly="true" aria-multiline="true" tabindex="0"></div>

      <div class="message-stats" aria-live="polite">
        <div class="stat">
          <span class="stat-value" id="total-characters">0</span>
          <span class="stat-label">Characters</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="message-count">0</span>
          <span class="stat-label">Messages</span>
        </div>
      </div>
      <ul id="issue-summary" class="issue-summary" role="status" aria-live="polite" aria-atomic="true" hidden></ul>

      <h3 id="cockpit-display-heading">Display</h3>
      <div class="cockpit-viewport">
        <div class="cockpit-frame">
          <pre id="cockpit-display" tabindex="0" aria-labelledby="cockpit-display-heading"></pre>
        </div>
      </div>
    </section>
  </main>

  <dialog id="delete-tab-dialog" class="delete-tab-dialog" aria-labelledby="delete-tab-heading" aria-describedby="delete-tab-description">
    <form method="dialog">
      <h2 id="delete-tab-heading">Delete tab?</h2>
      <p id="delete-tab-description">This action cannot be undone.</p>
      <div class="dialog-actions">
        <button id="cancel-delete-tab" type="button">Cancel</button>
        <button id="confirm-delete-tab" type="button">Delete tab</button>
      </div>
    </form>
  </dialog>

  <script>
    // Project-specific definitions live here. Adding a platform or form should
    // only require adding another entry to one of these registries.
    const PLATFORM_DATA = [
      {
        label: "F-16",
        charsPerLine: 40,
        screenLines: 12,
        supportsDoubleSlash: true,
        harvestableCoordinatePattern: /\d{2}[A-Z] [A-Z]{2}\d \d{3} \d{3} \d{3}/g
      },
      {
        label: "F-35",
        charsPerLine: 32,
        screenLines: 6,
        supportsDoubleSlash: false,
        harvestableCoordinatePattern: /\d{2}[A-Z] [A-Z]{2} \d{5} \d{5}/g
      },
      {
        label: "F-15",
        charsPerLine: 24,
        screenLines: 10,
        supportsDoubleSlash: true,
        harvestableCoordinatePattern: /\d{2}[A-Z] [A-Z]{2} \d{5} \d{5}/g
      },
      {
        label: "A-10",
        charsPerLine: 16,
        screenLines: 5,
        supportsDoubleSlash: true,
        harvestableCoordinatePattern: /\d{2}[A-Z] [A-Z]{2}\d \d{3} \d{3} \d{3}/g
      }
    ];

    const FORM_DATA = [
      {
        label: "Marshall",
        passages: [
          {label: "Name and ATO Day", type: "text"},
          {
            label: "Mission Status",
            type: "select",
            options: [
              {label: "Mission Successful", text: "Succ"},
              {label: "Mission Failure", text: "Fail"}
            ]
          },
          {label: "Tanker Status", type: "text"},
          {label: "Friendly Aircraft", type: "text"},
          {label: "Munitions Expended", type: "text"},
          {label: "Timing Targets", type: "text"},
          {label: "Test", type: "text"},
          {label: "Admin/Remarks", type: "text"}
        ]
      },
      {
        label: "DCA",
        passages: [
          {label: "Lorem ipsum dolor si", type: "text"},
          {label: "Lorem ipsum dolor si", type: "text"},
          {label: "Lorem ipsum dolor si", type: "text"},
          {label: "Lorem ipsum dolor si", type: "text"}
        ]
      }
    ];

    let nextTabNumber = 1;
    let pendingTabDeletion = null;

    function createTabState() {
      return {
        name: `Message ${nextTabNumber++}`,
        formId: 0,
        platformId: 0,
        modeId: "lineBreak",
        prefixId: "indexPeriod",
        values: Object.fromEntries(FORM_DATA.map((form, formId) => [
          formId,
          Array(form.passages.length).fill("")
        ]))
      };
    }

    // Maximum characters per message; used to derive the message count.
    const MESSAGE_LENGTH = 40;
    const LEGAL_CHARACTERS = new Set("ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ./-");

    const state = {
      tabID: 0,
      tabs: [createTabState()],
      get activeTab() {
        return this.tabs[this.tabID];
      },
      get formId() {
        return this.activeTab.formId;
      },
      set formId(value) {
        this.activeTab.formId = value;
      },
      get platformId() {
        return this.activeTab.platformId;
      },
      set platformId(value) {
        this.activeTab.platformId = value;
      },
      get modeId() {
        return this.activeTab.modeId;
      },
      set modeId(value) {
        this.activeTab.modeId = value;
      },
      get prefixId() {
        return this.activeTab.prefixId;
      },
      set prefixId(value) {
        this.activeTab.prefixId = value;
      },
      get values() {
        return this.activeTab.values;
      },
      set values(value) {
        this.activeTab.values = value;
      }
    };

    const elements = {
      workspace: document.querySelector("#formatter-workspace"),
      themeToggle: document.querySelector("#theme-toggle"),
      appHeader: document.querySelector(".app-header"),
      tabList: document.querySelector("#tab-list"),
      addTab: document.querySelector("#add-tab"),
      formSelect: document.querySelector("#form-select"),
      platformSelect: document.querySelector("#platform-select"),
      modeSelect: document.querySelector("#mode-select"),
      prefixSelect: document.querySelector("#prefix-select"),
      passageFields: document.querySelector("#passage-fields"),
      passageFieldsHeading: document.querySelector("#passage-fields-heading"),
      outputText: document.querySelector("#output-text"),
      copyButton: document.querySelector("#copy-button"),
      totalCharacters: document.querySelector("#total-characters"),
      messageCount: document.querySelector("#message-count"),
      issueSummary: document.querySelector("#issue-summary"),
      cockpitDisplay: document.querySelector("#cockpit-display"),
      deleteTabDialog: document.querySelector("#delete-tab-dialog"),
      deleteTabHeading: document.querySelector("#delete-tab-heading"),
      cancelDeleteTab: document.querySelector("#cancel-delete-tab"),
      confirmDeleteTab: document.querySelector("#confirm-delete-tab")
    };

    function populateSelect(select, definitions) {
      Object.entries(definitions).forEach(([id, definition]) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = definition.label;
        select.append(option);
      });
    }

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.dataset.theme = theme;
      elements.themeToggle.title = isDark ? "Switch to light mode" : "Switch to dark mode";
      elements.themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
      try {
        localStorage.setItem("j282-theme", theme);
      } catch (error) {
        // The theme still applies when storage is unavailable.
      }
    }

    function initializeTheme() {
      let theme = "light";
      try {
        const savedTheme = localStorage.getItem("j282-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          theme = savedTheme;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      } catch (error) {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      }
      applyTheme(theme);
    }

    function activateTab(tabID, moveFocus = false) {
      state.tabID = tabID;
      elements.tabList.querySelectorAll('[role="tab"]').forEach((button, index) => {
        const isActive = index === tabID;
        button.setAttribute("aria-selected", String(isActive));
        button.tabIndex = isActive ? 0 : -1;
      });
      elements.workspace.setAttribute("aria-labelledby", `message-tab-${tabID}`);
      renderSetup();

      if (moveFocus) {
        document.querySelector(`#message-tab-${state.tabID}`).focus();
      }
    }

    function closeTab(tabID) {
      if (state.tabs.length === 1) return;

      state.tabs.splice(tabID, 1);
      if (state.tabID > tabID) {
        state.tabID -= 1;
      } else if (state.tabID === tabID) {
        state.tabID = Math.min(tabID, state.tabs.length - 1);
      }
      renderTabs();
      activateTab(state.tabID, true);
    }

    function requestTabDeletion(tabID, trigger) {
      const tab = state.tabs[tabID];
      pendingTabDeletion = {tabID, trigger};
      elements.deleteTabHeading.textContent = `Delete “${tab.name}”?`;
      elements.deleteTabDialog.returnValue = "";
      elements.deleteTabDialog.showModal();
      elements.cancelDeleteTab.focus({preventScroll: true});
    }

    function cancelTabDeletion() {
      const deletion = pendingTabDeletion;
      pendingTabDeletion = null;
      elements.deleteTabDialog.close();
      if (deletion?.trigger.isConnected) deletion.trigger.focus({preventScroll: true});
    }

    function confirmTabDeletion() {
      const deletion = pendingTabDeletion;
      pendingTabDeletion = null;
      elements.deleteTabDialog.close();
      if (deletion) closeTab(deletion.tabID);
    }

    function renameTab(tabID) {
      const button = document.querySelector(`#message-tab-${tabID}`);
      if (button.hidden) return;
      const tab = state.tabs[tabID];
      const input = document.createElement("input");
      input.className = "tab-name-input";
      input.value = tab.name;
      input.setAttribute("aria-label", "Message tab name");
      let finished = false;
      const finish = (save, restoreFocus) => {
        if (finished) return;
        finished = true;
        if (save && input.value.trim()) tab.name = input.value.trim();
        button.textContent = tab.name;
        button.title = `${tab.name} — Double-click or press F2 to rename`;
        const closeButton = button.parentElement.querySelector(".close-tab");
        if (closeButton) closeButton.setAttribute("aria-label", `Close ${tab.name}`);
        button.hidden = false;
        input.remove();
        if (restoreFocus) button.focus();
      };
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === "Escape") {
          event.preventDefault();
          finish(event.key === "Enter", true);
        }
      });
      input.addEventListener("blur", () => finish(true, false));
      button.hidden = true;
      button.after(input);
      input.focus();
      input.select();
    }

    function handleTabKeydown(event, tabID) {
      if (event.key === "F2") {
        event.preventDefault();
        renameTab(tabID);
        return;
      }
      let nextTabID;
      if (event.key === "ArrowLeft") {
        nextTabID = (tabID - 1 + state.tabs.length) % state.tabs.length;
      } else if (event.key === "ArrowRight") {
        nextTabID = (tabID + 1) % state.tabs.length;
      } else if (event.key === "Home") {
        nextTabID = 0;
      } else if (event.key === "End") {
        nextTabID = state.tabs.length - 1;
      } else {
        return;
      }

      event.preventDefault();
      activateTab(nextTabID, true);
    }

    function renderTabs() {
      elements.tabList.replaceChildren();

      state.tabs.forEach((tab, tabID) => {
        const isActive = tabID === state.tabID;
        const item = document.createElement("span");
        const tabButton = document.createElement("button");

        item.className = "tab-item";
        tabButton.id = `message-tab-${tabID}`;
        tabButton.className = "tab-button";
        tabButton.type = "button";
        tabButton.setAttribute("role", "tab");
        tabButton.textContent = tab.name;
        tabButton.title = `${tab.name} — Double-click or press F2 to rename`;
        tabButton.tabIndex = isActive ? 0 : -1;
        tabButton.setAttribute("aria-selected", String(isActive));
        tabButton.setAttribute("aria-controls", "formatter-workspace");
        tabButton.addEventListener("click", () => activateTab(tabID, true));
        tabButton.addEventListener("dblclick", () => renameTab(tabID));
        tabButton.addEventListener("keydown", (event) => handleTabKeydown(event, tabID));
        item.append(tabButton);

        if (state.tabs.length > 1) {
          const closeButton = document.createElement("button");
          closeButton.className = "close-tab";
          closeButton.type = "button";
          closeButton.textContent = "×";
          closeButton.setAttribute("aria-label", `Close ${tab.name}`);
          closeButton.addEventListener("click", () => requestTabDeletion(tabID, closeButton));
          item.append(closeButton);
        }

        elements.tabList.append(item);
      });

      elements.workspace.setAttribute("aria-labelledby", `message-tab-${state.tabID}`);
    }

    function uppercase(value) {
      return value.toLocaleUpperCase("en-US");
    }

    function lettersForIndex(index) {
      let number = index + 1;
      let result = "";
      while (number > 0) {
        number -= 1;
        result = String.fromCharCode(65 + (number % 26)) + result;
        number = Math.floor(number / 26);
      }
      return result;
    }

    function passagePrefix(prefixId, passageIndex) {
      const number = String(passageIndex + 1);
      const letter = lettersForIndex(passageIndex);

      switch (prefixId) {
        case "indexSpace": return `${number} `;
        case "indexPeriod": return `${number}.`;
        case "indexDash": return `${number}-`;
        case "alphaSpace": return `${letter} `;
        case "alphaPeriod": return `${letter}.`;
        case "alphaDash": return `${letter}-`;
        default: return "";
      }
    }

    function formatPassage(value, index) {
      const platform = PLATFORM_DATA[state.platformId];
      const text = uppercase(value.trim().replace(/\r\n|\r|\n/g, "//"));
      if (!text) return null;

      const formatted = `${passagePrefix(state.prefixId, index)}${text}`;
      if (platform.supportsDoubleSlash || !formatted.includes("//")) return formatted;

      const sections = formatted.split("//");
      return sections.map((section, sectionIndex) => {
        const isFinalSection = sectionIndex === sections.length - 1;
        if (isFinalSection) return section;
        return section ? padToWidth(section, platform.charsPerLine) : " ".repeat(platform.charsPerLine);
      }).join("");
    }

    function padToWidth(value, width) {
      const padding = width - (value.length % width || width);
      return padding === width ? value : `${value}${" ".repeat(padding)}`;
    }

    function combinePassages(passages, platform) {
      if (passages.length === 0) return "";

      if (state.modeId === "lineBreak") {
        if (platform.supportsDoubleSlash) {
          return passages.join("//");
        }

        return passages.map((passage, index) => {
          const isFinalPassage = index === passages.length - 1;
          if (isFinalPassage) return passage;
          return padToWidth(passage, platform.charsPerLine);
        }).join("");
      }

      const suffix = state.modeId === "singleSlash" ? "/" : "-";
      return passages.map((passage, index) => {
        const isFinalPassage = index === passages.length - 1;
        return isFinalPassage ? passage : `${passage}${suffix}`;
      }).join("");
    }

    function wrapDisplayText(text, width) {
      if (!text) return [""];

      const displayLines = [];
      for (let index = 0; index < text.length; index += width) {
        displayLines.push(text.slice(index, index + width));
      }
      return displayLines;
    }

    function wrapDisplayTextWithContext(text, width) {
      return wrapDisplayText(text, width).map((line, lineIndex) => {
        const start = lineIndex * width;
        return {
          line,
          precedingCharacter: text[start - 1] || "",
          followingCharacter: text[start + line.length] || ""
        };
      });
    }

    function harvestableCoordinateRanges(line, pattern, precedingLineCharacter, followingLineCharacter) {
      const ranges = [];
      pattern.lastIndex = 0;

      for (const match of line.matchAll(pattern)) {
        const start = match.index;
        const end = start + match[0].length;
        const precedingCharacter = start === 0 ? precedingLineCharacter : line[start - 1];
        const followingCharacter = end === line.length ? followingLineCharacter : line[end];
        const hasValidStartBoundary = !precedingCharacter || !/[A-Z0-9]/.test(precedingCharacter);
        const hasValidEndBoundary = !followingCharacter || !/[A-Z0-9]/.test(followingCharacter);

        if (hasValidStartBoundary && hasValidEndBoundary) ranges.push({start, end});
      }

      return ranges;
    }

    function renderCockpitLine(line, pattern, precedingCharacter, followingCharacter) {
      const lineOutput = document.createDocumentFragment();
      const ranges = harvestableCoordinateRanges(line, pattern, precedingCharacter, followingCharacter);
      let cursor = 0;

      ranges.forEach(({start, end}) => {
        lineOutput.append(document.createTextNode(line.slice(cursor, start)));
        const coordinate = document.createElement("span");
        coordinate.className = "harvestable-coordinate";
        coordinate.textContent = line.slice(start, end);
        lineOutput.append(coordinate);
        cursor = end;
      });

      lineOutput.append(document.createTextNode(line.slice(cursor)));
      return lineOutput;
    }

    function renderCockpitDisplay(formattedMessage) {
      const platform = PLATFORM_DATA[state.platformId];
      const cockpitMessage = Array.from(formattedMessage, (character) =>
        LEGAL_CHARACTERS.has(character) ? character : "~"
      ).join("");
      const displayLines = platform.supportsDoubleSlash
        ? cockpitMessage.split("//").flatMap((passage) => wrapDisplayTextWithContext(passage, platform.charsPerLine))
        : wrapDisplayTextWithContext(cockpitMessage, platform.charsPerLine);

      const displayOutput = document.createDocumentFragment();
      displayLines.forEach(({line, precedingCharacter, followingCharacter}, index) => {
        if (index > 0) displayOutput.append(document.createTextNode("\n"));
        displayOutput.append(renderCockpitLine(
          line,
          platform.harvestableCoordinatePattern,
          precedingCharacter,
          followingCharacter
        ));
      });
      elements.cockpitDisplay.replaceChildren(displayOutput);
      return displayLines.length;
    }

    function formatMessage() {
      const platform = PLATFORM_DATA[state.platformId];
      const form = FORM_DATA[state.formId];
      const passages = state.values[state.formId]
        .map((value, index) => formatPassage(resolvePassageText(form.passages[index], value), index))
        .filter(Boolean);
      passages.push("EOM");

      return combinePassages(passages, platform);
    }

    function resolvePassageText(passage, value) {
      if (passage.type !== "select") return value;
      if (value === "" || !Array.isArray(passage.options)) return "";

      const optionIndex = Number(value);
      if (!Number.isInteger(optionIndex)) return "";
      return passage.options[optionIndex]?.text || "";
    }

    function reviewUnintentionalLineSplits(formattedMessage) {
      const platform = PLATFORM_DATA[state.platformId];
      const characters = Array.from(formattedMessage);
      const issues = [];
      let segmentStart = 0;

      function reviewSegment(segmentEnd) {
        let blockStart = segmentStart;

        while (blockStart < segmentEnd) {
          while (blockStart < segmentEnd && characters[blockStart] === " ") blockStart += 1;
          if (blockStart === segmentEnd) break;

          let blockEnd = blockStart + 1;
          while (blockEnd < segmentEnd && characters[blockEnd] !== " ") blockEnd += 1;

          const startColumn = blockStart - segmentStart;
          const endColumn = blockEnd - segmentStart - 1;
          const crossesLineBoundary = Math.floor(startColumn / platform.charsPerLine)
            !== Math.floor(endColumn / platform.charsPerLine);

          if (crossesLineBoundary) {
            for (let index = blockStart; index < blockEnd; index += 1) {
              issues.push({type: "unintentional-line-split", index});
            }
          }

          blockStart = blockEnd;
        }
      }

      if (platform.supportsDoubleSlash) {
        for (let index = 0; index < characters.length - 1; index += 1) {
          if (characters[index] !== "/" || characters[index + 1] !== "/") continue;
          reviewSegment(index);
          segmentStart = index + 2;
          index += 1;
        }
      }

      reviewSegment(characters.length);
      return issues;
    }

    function reviewFormattedMessage(formattedMessage) {
      const illegalCharacterIssues = Array.from(formattedMessage).flatMap((character, index) => {
        if (LEGAL_CHARACTERS.has(character)) return [];
        return [{type: "illegal-character", character, index}];
      });

      return [...illegalCharacterIssues, ...reviewUnintentionalLineSplits(formattedMessage)];
    }

    function renderReviewedOutput(formattedMessage, issues) {
      const issuesByIndex = new Map();
      issues.forEach((issue) => {
        const issueTypes = issuesByIndex.get(issue.index) || new Set();
        issueTypes.add(issue.type);
        issuesByIndex.set(issue.index, issueTypes);
      });
      const output = document.createDocumentFragment();
      const characters = Array.from(formattedMessage);

      for (let index = 0; index < characters.length;) {
        const character = characters[index];
        const issueTypes = issuesByIndex.get(index);
        if (!issueTypes) {
          output.append(document.createTextNode(character));
          index += 1;
          continue;
        }

        let issueCharacters = character;
        let nextIndex = index + 1;
        const issueKey = [...issueTypes].sort().join(" ");
        while ([...(issuesByIndex.get(nextIndex) || [])].sort().join(" ") === issueKey) {
          issueCharacters += characters[nextIndex];
          nextIndex += 1;
        }

        const issueText = document.createElement("span");
        issueText.className = [...issueTypes].map((type) => `issue-${type}`).join(" ");
        issueText.textContent = issueCharacters;
        output.append(issueText);
        index = nextIndex;
      }

      elements.outputText.replaceChildren(output);
    }

    function countIssueRuns(issues, type) {
      const indexes = issues
        .filter((issue) => issue.type === type)
        .map((issue) => issue.index)
        .sort((first, second) => first - second);

      return indexes.reduce((count, index, position) => {
        return count + (position === 0 || index !== indexes[position - 1] + 1 ? 1 : 0);
      }, 0);
    }

    function renderIssueSummary(issues, displayLineCount) {
      const platform = PLATFORM_DATA[state.platformId];
      const illegalCharacterCount = issues.filter((issue) => issue.type === "illegal-character").length;
      const splitBlockCount = countIssueRuns(issues, "unintentional-line-split");
      const summaryItems = [];

      if (illegalCharacterCount > 0) {
        summaryItems.push(`${illegalCharacterCount} illegal ${illegalCharacterCount === 1 ? "character" : "characters"}`);
      }
      if (splitBlockCount > 0) {
        summaryItems.push(`${splitBlockCount} split ${splitBlockCount === 1 ? "block" : "blocks"}`);
      }
      if (displayLineCount > platform.screenLines) {
        summaryItems.push("Display scroll required");
      }

      elements.issueSummary.replaceChildren(...summaryItems.map((summary) => {
        const item = document.createElement("li");
        item.textContent = summary;
        return item;
      }));
      elements.issueSummary.hidden = summaryItems.length === 0;
    }

    function autoSizeTextarea(textarea) {
      textarea.style.height = "auto";
      const borderHeight = textarea.offsetHeight - textarea.clientHeight;
      textarea.style.height = `${textarea.scrollHeight + borderHeight}px`;
    }

    function renderPassageFields() {
      const form = FORM_DATA[state.formId];
      elements.passageFields.replaceChildren();
      elements.passageFieldsHeading.textContent = "Input";

      form.passages.forEach((passage, index) => {
        const passageNumber = index + 1;
        const passageLabel = `${passageNumber}. ${passage.label}`;
        const passageId = `form-${state.formId}-passage-${passageNumber}`;
        const wrapper = document.createElement("p");
        const label = document.createElement("label");
        const input = document.createElement(passage.type === "select" ? "select" : "textarea");

        wrapper.className = "passage-field";
        input.id = passageId;
        if (passage.type === "select") {
          const emptyOption = document.createElement("option");
          emptyOption.value = "";
          emptyOption.textContent = "Select an option";
          input.append(emptyOption);

          if (Array.isArray(passage.options)) {
            passage.options.forEach((option, optionIndex) => {
              const optionElement = document.createElement("option");
              optionElement.value = String(optionIndex);
              optionElement.textContent = option?.label || "";
              input.append(optionElement);
            });
          }
        } else {
          input.rows = 1;
          input.autocomplete = "off";
          input.spellcheck = false;
        }
        input.value = state.values[state.formId][index];
        input.addEventListener(passage.type === "select" ? "change" : "input", (event) => {
          state.values[state.formId][index] = event.target.value;
          if (event.target instanceof HTMLTextAreaElement) autoSizeTextarea(event.target);
          renderFormattedMessage();
        });

        label.htmlFor = passageId;
        label.textContent = passageLabel;

        wrapper.append(label, input);
        elements.passageFields.append(wrapper);
        if (input instanceof HTMLTextAreaElement) autoSizeTextarea(input);
      });
    }

    function renderFormattedMessage() {
      const formatted = formatMessage();
      const issues = reviewFormattedMessage(formatted);
      renderReviewedOutput(formatted, issues);
      elements.totalCharacters.textContent = formatted.length;
      elements.messageCount.textContent = Math.ceil(formatted.length / MESSAGE_LENGTH);
      const displayLineCount = renderCockpitDisplay(formatted);
      renderIssueSummary(issues, displayLineCount);
    }

    function renderSetup() {
      elements.formSelect.value = String(state.formId);
      elements.platformSelect.value = String(state.platformId);
      elements.modeSelect.value = state.modeId;
      elements.prefixSelect.value = state.prefixId;
      elements.cockpitDisplay.style.setProperty("--chars-per-line", PLATFORM_DATA[state.platformId].charsPerLine);
      elements.cockpitDisplay.style.setProperty("--screen-lines", PLATFORM_DATA[state.platformId].screenLines);
      renderPassageFields();
      renderFormattedMessage();
    }

    elements.formSelect.addEventListener("change", (event) => {
      state.formId = Number(event.target.value);
      renderSetup();
    });

    elements.platformSelect.addEventListener("change", (event) => {
      state.platformId = Number(event.target.value);
      renderSetup();
    });

    elements.modeSelect.addEventListener("change", (event) => {
      state.modeId = event.target.value;
      renderFormattedMessage();
    });

    elements.prefixSelect.addEventListener("change", (event) => {
      state.prefixId = event.target.value;
      renderFormattedMessage();
    });

    elements.copyButton.addEventListener("click", async () => {
      const formatted = elements.outputText.textContent;
      try {
        await navigator.clipboard.writeText(formatted);
        elements.copyButton.textContent = "Copied";
      } catch (error) {
        elements.outputText.focus();
        const range = document.createRange();
        const selection = window.getSelection();
        range.selectNodeContents(elements.outputText);
        selection.removeAllRanges();
        selection.addRange(range);
        elements.copyButton.textContent = document.execCommand("copy") ? "Copied" : "Select and copy";
      }
      window.setTimeout(() => {elements.copyButton.textContent = "Copy message";}, 1600);
    });

    elements.themeToggle.addEventListener("click", () => {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(nextTheme);
    });

    function syncStickyHeaderHeight() {
      document.documentElement.style.setProperty("--sticky-header-height", `${elements.appHeader.offsetHeight}px`);
    }

    window.addEventListener("resize", () => {
      elements.passageFields.querySelectorAll("textarea").forEach(autoSizeTextarea);
      syncStickyHeaderHeight();
    });

    elements.addTab.addEventListener("click", () => {
      state.tabs.push(createTabState());
      renderTabs();
      activateTab(state.tabs.length - 1, true);
    });

    elements.cancelDeleteTab.addEventListener("click", cancelTabDeletion);
    elements.confirmDeleteTab.addEventListener("click", confirmTabDeletion);
    elements.deleteTabDialog.addEventListener("cancel", (event) => {
      event.preventDefault();
      cancelTabDeletion();
    });

    populateSelect(elements.formSelect, FORM_DATA);
    populateSelect(elements.platformSelect, PLATFORM_DATA);
    initializeTheme();
    renderTabs();
    renderSetup();
    syncStickyHeaderHeight();
  </script>
</body>
</html>
