<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J28.2 Formatter</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f5f6f8;
      --surface: #ffffff;
      --surface-muted: #eef1f4;
      --text: #17202a;
      --muted: #5d6975;
      --border: #c9d0d7;
      --accent: #245ea8;
      --accent-text: #ffffff;
      --focus: #4c8fe8;
      --cockpit: #101820;
      --cockpit-text: #b8ffb8;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #11161c;
      --surface: #1b222b;
      --surface-muted: #252e38;
      --text: #edf2f7;
      --muted: #abb6c2;
      --border: #45515e;
      --accent: #75aef2;
      --accent-text: #101820;
      --focus: #91c1fa;
      --cockpit: #080d11;
      --cockpit-text: #a8f5a8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    button,
    select,
    textarea {
      color: inherit;
      font: inherit;
    }

    button,
    select,
    textarea,
    .settings-panel,
    .data-panel,
    .output-panel {
      border: 1px solid var(--border);
      border-radius: 0.4rem;
    }

    button {
      min-height: 2.5rem;
      padding: 0.45rem 0.8rem;
      background: var(--surface-muted);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    #cockpit-display:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .app-header {
      background: var(--surface);
      box-shadow: inset 0 -1px var(--border);
    }

    .header-top,
    .tab-bar,
    main {
      width: min(75rem, calc(100% - 2rem));
      margin-inline: auto;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-block: 0.5rem;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3 {
      font-size: 1.5rem;
    }

    h1 {
      margin-bottom: 0;
    }

    .tab-bar,
    #tab-list,
    .tab-item {
      display: flex;
      align-items: center;
    }

    .tab-bar {
      gap: 0.5rem;
      align-items: flex-end;
      padding-bottom: 0;
    }

    #tab-list {
      gap: 0.3rem;
      min-width: 0;
      overflow-x: auto;
      padding: 0.25rem 0.25rem 0;
    }

    .tab-item {
      flex: none;
      padding-right: 0.25rem;
      border: 1px solid var(--border);
      border-radius: 0.65rem 0.65rem 0 0;
      color: var(--muted);
      background: var(--surface-muted);
    }

    .tab-item:has([aria-selected="true"]) {
      border-bottom-color: var(--background);
      color: var(--text);
      background: var(--background);
    }

    .tab-button {
      border: 0;
      border-radius: 0.5rem;
      background: transparent;
      white-space: nowrap;
      padding: 0.4rem 0.9rem;
      max-width: 16rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-name-input {
      width: 12rem;
      min-width: 0;
      margin: 0.3rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--accent);
      border-radius: 0.3rem;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
    }

    .tab-name-input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .tab-button[aria-selected="true"] {
      color: var(--accent);
      font-weight: 650;
    }

    .close-tab {
      min-width: 1.5rem;
      height: 1.5rem;
      padding: 0;
      border: 0;
      border-radius: 0.3rem;
      background: transparent;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .tab-item:hover .close-tab,
    .tab-item:focus-within .close-tab {
      opacity: 1;
    }

    .close-tab:hover {
      color: var(--text);
    }

    #add-tab {
      flex: none;
      width: 2.1rem;
      height: 2.1rem;
      padding: 0;
      border: 0;
      border-radius: 0.5rem;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      font-weight: 400;
      line-height: 1;
    }

    #add-tab:hover {
      color: var(--text);
    }

    @media (prefers-reduced-motion: reduce) {
      .close-tab {
        transition: none;
      }
    }

    #theme-toggle {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex: none;
      width: 5.5rem;
      height: 2.5rem;
      padding: 0.25rem;
      border-radius: 2rem;
    }

    #theme-toggle::before {
      content: "";
      position: absolute;
      left: 0.25rem;
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 4px #0003;
      transition: transform 180ms ease;
    }

    :root[data-theme="dark"] #theme-toggle::before {
      transform: translateX(2.8rem);
    }

    #theme-toggle svg {
      position: relative;
      width: 1.2rem;
      height: 1.2rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      color: var(--muted);
    }

    :root:not([data-theme="dark"]) .sun-icon,
    :root[data-theme="dark"] .moon-icon {
      color: var(--accent) !important;
    }

    @media (prefers-reduced-motion: reduce) {
      #theme-toggle::before {
        transition: none;
      }
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(20rem, 0.8fr);
      gap: 1rem;
      padding-block: 0.75rem 1rem;
    }

    .input-column,
    .settings-panel,
    .data-panel,
    .output-panel {
      min-width: 0;
    }

    .settings-panel,
    .data-panel,
    .output-panel {
      margin: 0 0 0.75rem;
      padding: 0.85rem;
      border-radius: 0.75rem;
      background: var(--surface);
    }

    .settings-panel h2,
    .data-panel h2,
    .output-panel h2 {
      margin-top: 0;
      margin-bottom: 0.75rem;
    }

    .output-panel {
      position: sticky;
      top: 0.75rem;
      align-self: start;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .setup-grid p,
    .passage-field {
      margin-bottom: 0;
    }

    label,
    small {
      display: block;
    }

    label {
      margin-bottom: 0.25rem;
      font-weight: 650;
    }

    select,
    textarea {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border-color: var(--border);
      background: var(--surface);
    }

    #passage-fields {
      display: grid;
      gap: 0.75rem;
    }

    .passage-field label {
      margin-bottom: 0.25rem;
      font-size: 1rem;
      font-weight: 600;
    }

    .passage-field textarea {
      min-height: 3rem;
      resize: vertical;
      font-size: 1.25rem;
    }

    #output-text {
      display: block;
      margin-bottom: 0.5rem;
      min-height: 5rem;
      resize: vertical;
    }

    #copy-button {
      flex: none;
      margin-bottom: 0;
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .output-header h2 {
      margin-bottom: 0;
    }

    .message-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .stat {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--surface-muted);
      text-align: center;
      white-space: nowrap;
    }

    .stat-value {
      display: inline;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      display: inline;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .cockpit-viewport {
      max-width: 100%;
      overflow-x: auto;
    }

    #cockpit-display-heading {
      margin: 0.75rem 0;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    #cockpit-display {
      --chars-per-line: 40;
      --screen-lines: 12;
      width: calc((var(--chars-per-line) * 1ch) + 1.6rem + 2px);
      height: calc((var(--screen-lines) * 1.5rem) + 1.6rem + 2px);
      margin: 0;
      overflow: auto;
      padding: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      background: var(--cockpit);
      color: var(--cockpit-text);
      font: 1rem/1.5rem ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre;
    }

    @media (max-width: 48rem) {
      main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 34rem) {
      .settings-panel,
      .data-panel,
      .output-panel {
        padding: 0.75rem;
      }

      .header-top {
        align-items: flex-start;
      }

      .setup-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <h1>FORMATTER</h1>
      <button id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/></svg>
      </button>
    </div>
    <nav class="tab-bar" aria-label="Messages">
      <div id="tab-list" role="tablist" aria-label="Message tabs"></div>
      <button id="add-tab" type="button" aria-label="Add message tab" title="Add message tab">+</button>
    </nav>
  </header>

  <main id="formatter-workspace" role="tabpanel" aria-labelledby="message-tab-0">

    <div id="formatter-form" class="input-column">
      <section class="settings-panel" aria-labelledby="settings-heading">
        <h2 id="settings-heading">Setup</h2>
        <div class="setup-grid">
          <p>
            <label for="form-select">Form</label>
            <select id="form-select"></select>
          </p>

          <p>
            <label for="platform-select">Platform</label>
            <select id="platform-select"></select>
          </p>

          <p>
            <label for="mode-select">Line combination</label>
            <select id="mode-select">
              <option value="lineBreak">Line Break</option>
              <option value="singleSlash">Single slash</option>
              <option value="dash">Dash</option>
            </select>
          </p>

          <p>
            <label for="prefix-select">Passage prefix</label>
            <select id="prefix-select">
              <option value="indexSpace">Index with space</option>
              <option value="indexPeriod">Index with period</option>
              <option value="indexDash">Index with dash</option>
              <option value="alphaSpace">Alphabetical with space</option>
              <option value="alphaPeriod">Alphabetical with period</option>
              <option value="alphaDash">Alphabetical with dash</option>
              <option value="none">None</option>
            </select>
          </p>
        </div>
      </section>

      <section class="data-panel" aria-labelledby="passage-fields-heading">
        <h2 id="passage-fields-heading">Input</h2>
        <div id="passage-fields"></div>
      </section>
    </div>

    <section class="output-panel" aria-labelledby="output-heading">
      <div class="output-header">
        <h2 id="output-heading">Output</h2>
        <button id="copy-button" type="button">Copy message</button>
      </div>
      <textarea id="output-text" aria-label="Output" readonly spellcheck="false"></textarea>

      <div class="message-stats" aria-live="polite">
        <div class="stat">
          <span class="stat-value" id="total-characters">0</span>
          <span class="stat-label">Characters</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="message-count">0</span>
          <span class="stat-label">Messages</span>
        </div>
      </div>

      <h3 id="cockpit-display-heading">Display</h3>
      <div class="cockpit-viewport">
        <pre id="cockpit-display" tabindex="0" aria-labelledby="cockpit-display-heading"></pre>
      </div>
    </section>
  </main>

  <script>
    // Project-specific definitions live here. Adding a platform or form should
    // only require adding another entry to one of these registries.
    const PLATFORM_DATA = [
      {
        label: "F-16",
        charsPerLine: 40,
        screenLines: 12,
        supportsDoubleSlash: true
      },
      {
        label: "F-35",
        charsPerLine: 32,
        screenLines: 6,
        supportsDoubleSlash: false
      },
      {
        label: "F-15",
        charsPerLine: 24,
        screenLines: 10,
        supportsDoubleSlash: true
      },
      {
        label: "A-10",
        charsPerLine: 16,
        screenLines: 5,
        supportsDoubleSlash: true
      }
    ];

    const FORM_DATA = [
      {
        label: "Marshall",
        passages: [
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si"
        ]
      },
      {
        label: "DCA",
        passages: [
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si",
          "Lorem ipsum dolor si"
        ]
      }
    ];

    let nextTabNumber = 1;

    function createTabState() {
      return {
        name: `Message ${nextTabNumber++}`,
        formId: 0,
        platformId: 0,
        modeId: "lineBreak",
        prefixId: "none",
        values: Object.fromEntries(FORM_DATA.map((form, formId) => [
          formId,
          Array(form.passages.length).fill("")
        ]))
      };
    }

    // Maximum characters per message; used to derive the message count.
    const MESSAGE_LENGTH = 40;

    const state = {
      tabID: 0,
      tabs: [createTabState()],
      get activeTab() {
        return this.tabs[this.tabID];
      },
      get formId() {
        return this.activeTab.formId;
      },
      set formId(value) {
        this.activeTab.formId = value;
      },
      get platformId() {
        return this.activeTab.platformId;
      },
      set platformId(value) {
        this.activeTab.platformId = value;
      },
      get modeId() {
        return this.activeTab.modeId;
      },
      set modeId(value) {
        this.activeTab.modeId = value;
      },
      get prefixId() {
        return this.activeTab.prefixId;
      },
      set prefixId(value) {
        this.activeTab.prefixId = value;
      },
      get values() {
        return this.activeTab.values;
      },
      set values(value) {
        this.activeTab.values = value;
      }
    };

    const elements = {
      workspace: document.querySelector("#formatter-workspace"),
      themeToggle: document.querySelector("#theme-toggle"),
      tabList: document.querySelector("#tab-list"),
      addTab: document.querySelector("#add-tab"),
      formSelect: document.querySelector("#form-select"),
      platformSelect: document.querySelector("#platform-select"),
      modeSelect: document.querySelector("#mode-select"),
      prefixSelect: document.querySelector("#prefix-select"),
      passageFields: document.querySelector("#passage-fields"),
      passageFieldsHeading: document.querySelector("#passage-fields-heading"),
      outputText: document.querySelector("#output-text"),
      copyButton: document.querySelector("#copy-button"),
      totalCharacters: document.querySelector("#total-characters"),
      messageCount: document.querySelector("#message-count"),
      cockpitDisplay: document.querySelector("#cockpit-display")
    };

    function populateSelect(select, definitions) {
      Object.entries(definitions).forEach(([id, definition]) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = definition.label;
        select.append(option);
      });
    }

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.dataset.theme = theme;
      elements.themeToggle.title = isDark ? "Switch to light mode" : "Switch to dark mode";
      elements.themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
      try {
        localStorage.setItem("j282-theme", theme);
      } catch (error) {
        // The theme still applies when storage is unavailable.
      }
    }

    function initializeTheme() {
      let theme = "light";
      try {
        const savedTheme = localStorage.getItem("j282-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          theme = savedTheme;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      } catch (error) {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      }
      applyTheme(theme);
    }

    function activateTab(tabID, moveFocus = false) {
      state.tabID = tabID;
      elements.tabList.querySelectorAll('[role="tab"]').forEach((button, index) => {
        const isActive = index === tabID;
        button.setAttribute("aria-selected", String(isActive));
        button.tabIndex = isActive ? 0 : -1;
      });
      elements.workspace.setAttribute("aria-labelledby", `message-tab-${tabID}`);
      renderSetup();

      if (moveFocus) {
        document.querySelector(`#message-tab-${state.tabID}`).focus();
      }
    }

    function closeTab(tabID) {
      if (state.tabs.length === 1) return;

      state.tabs.splice(tabID, 1);
      if (state.tabID > tabID) {
        state.tabID -= 1;
      } else if (state.tabID === tabID) {
        state.tabID = Math.min(tabID, state.tabs.length - 1);
      }
      renderTabs();
      activateTab(state.tabID, true);
    }

    function renameTab(tabID) {
      const button = document.querySelector(`#message-tab-${tabID}`);
      if (button.hidden) return;
      const tab = state.tabs[tabID];
      const input = document.createElement("input");
      input.className = "tab-name-input";
      input.value = tab.name;
      input.setAttribute("aria-label", "Message tab name");
      let finished = false;
      const finish = (save, restoreFocus) => {
        if (finished) return;
        finished = true;
        if (save && input.value.trim()) tab.name = input.value.trim();
        button.textContent = tab.name;
        button.title = `${tab.name} — Double-click or press F2 to rename`;
        const closeButton = button.parentElement.querySelector(".close-tab");
        if (closeButton) closeButton.setAttribute("aria-label", `Close ${tab.name}`);
        button.hidden = false;
        input.remove();
        if (restoreFocus) button.focus();
      };
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === "Escape") {
          event.preventDefault();
          finish(event.key === "Enter", true);
        }
      });
      input.addEventListener("blur", () => finish(true, false));
      button.hidden = true;
      button.after(input);
      input.focus();
      input.select();
    }

    function handleTabKeydown(event, tabID) {
      if (event.key === "F2") {
        event.preventDefault();
        renameTab(tabID);
        return;
      }
      let nextTabID;
      if (event.key === "ArrowLeft") {
        nextTabID = (tabID - 1 + state.tabs.length) % state.tabs.length;
      } else if (event.key === "ArrowRight") {
        nextTabID = (tabID + 1) % state.tabs.length;
      } else if (event.key === "Home") {
        nextTabID = 0;
      } else if (event.key === "End") {
        nextTabID = state.tabs.length - 1;
      } else {
        return;
      }

      event.preventDefault();
      activateTab(nextTabID, true);
    }

    function renderTabs() {
      elements.tabList.replaceChildren();

      state.tabs.forEach((tab, tabID) => {
        const isActive = tabID === state.tabID;
        const item = document.createElement("span");
        const tabButton = document.createElement("button");

        item.className = "tab-item";
        tabButton.id = `message-tab-${tabID}`;
        tabButton.className = "tab-button";
        tabButton.type = "button";
        tabButton.setAttribute("role", "tab");
        tabButton.textContent = tab.name;
        tabButton.title = `${tab.name} — Double-click or press F2 to rename`;
        tabButton.tabIndex = isActive ? 0 : -1;
        tabButton.setAttribute("aria-selected", String(isActive));
        tabButton.setAttribute("aria-controls", "formatter-workspace");
        tabButton.addEventListener("click", () => activateTab(tabID, true));
        tabButton.addEventListener("dblclick", () => renameTab(tabID));
        tabButton.addEventListener("keydown", (event) => handleTabKeydown(event, tabID));
        item.append(tabButton);

        if (state.tabs.length > 1) {
          const closeButton = document.createElement("button");
          closeButton.className = "close-tab";
          closeButton.type = "button";
          closeButton.textContent = "×";
          closeButton.setAttribute("aria-label", `Close ${tab.name}`);
          closeButton.addEventListener("click", () => closeTab(tabID));
          item.append(closeButton);
        }

        elements.tabList.append(item);
      });

      elements.workspace.setAttribute("aria-labelledby", `message-tab-${state.tabID}`);
    }

    function uppercase(value) {
      return value.toLocaleUpperCase("en-US");
    }

    function lettersForIndex(index) {
      let number = index + 1;
      let result = "";
      while (number > 0) {
        number -= 1;
        result = String.fromCharCode(65 + (number % 26)) + result;
        number = Math.floor(number / 26);
      }
      return result;
    }

    function passagePrefix(prefixId, passageIndex) {
      const number = String(passageIndex + 1);
      const letter = lettersForIndex(passageIndex);

      switch (prefixId) {
        case "indexSpace": return `${number} `;
        case "indexPeriod": return `${number}.`;
        case "indexDash": return `${number}-`;
        case "alphaSpace": return `${letter} `;
        case "alphaPeriod": return `${letter}.`;
        case "alphaDash": return `${letter}-`;
        default: return "";
      }
    }

    function formatPassage(value, index) {
      const platform = PLATFORM_DATA[state.platformId];
      const text = uppercase(value.trim());
      if (!text) return null;

      const formatted = `${passagePrefix(state.prefixId, index)}${text}`;
      if (platform.supportsDoubleSlash || !value.includes("//")) return formatted;

      const sections = formatted.split("//");
      return sections.map((section, sectionIndex) => {
        const isFinalSection = sectionIndex === sections.length - 1;
        return isFinalSection ? section : padToWidth(section, platform.charsPerLine);
      }).join("");
    }

    function padToWidth(value, width) {
      const padding = width - (value.length % width || width);
      return padding === width ? value : `${value}${" ".repeat(padding)}`;
    }

    function combinePassages(passages, platform) {
      if (passages.length === 0) return "";

      if (state.modeId === "lineBreak") {
        if (platform.supportsDoubleSlash) {
          return passages.join("//");
        }

        return passages.map((passage, index) => {
          const isFinalPassage = index === passages.length - 1;
          if (isFinalPassage) return passage;
          return padToWidth(passage, platform.charsPerLine);
        }).join("");
      }

      const suffix = state.modeId === "singleSlash" ? "/" : "-";
      return passages.map((passage, index) => {
        const isFinalPassage = index === passages.length - 1;
        return isFinalPassage ? passage : `${passage}${suffix}`;
      }).join("");
    }

    function wrapDisplayText(text, width) {
      if (!text) return [""];

      const displayLines = [];
      for (let index = 0; index < text.length; index += width) {
        displayLines.push(text.slice(index, index + width));
      }
      return displayLines;
    }

    function renderCockpitDisplay(formattedMessage) {
      const platform = PLATFORM_DATA[state.platformId];
      const displayLines = platform.supportsDoubleSlash
        ? formattedMessage.split("//").flatMap((passage) => wrapDisplayText(passage, platform.charsPerLine))
        : wrapDisplayText(formattedMessage, platform.charsPerLine);

      elements.cockpitDisplay.textContent = displayLines.join("\n");
    }

    function formatMessage() {
      const platform = PLATFORM_DATA[state.platformId];
      const passages = state.values[state.formId]
        .map((value, index) => formatPassage(value, index))
        .filter(Boolean);
      passages.push("EOM");

      return combinePassages(passages, platform);
    }

    function renderPassageFields() {
      const form = FORM_DATA[state.formId];
      elements.passageFields.replaceChildren();
      elements.passageFieldsHeading.textContent = "Input";

      form.passages.forEach((passage, index) => {
        const passageNumber = index + 1;
        const passageLabel = `${passageNumber}. ${passage}`;
        const passageId = `form-${state.formId}-passage-${passageNumber}`;
        const wrapper = document.createElement("p");
        const label = document.createElement("label");
        const input = document.createElement("textarea");

        wrapper.className = "passage-field";
        input.id = passageId;
        input.rows = 3;
        input.autocomplete = "off";
        input.spellcheck = false;
        input.value = state.values[state.formId][index];
        input.addEventListener("input", (event) => {
          state.values[state.formId][index] = event.target.value;
          renderFormattedMessage();
        });

        label.htmlFor = passageId;
        label.textContent = passageLabel;

        wrapper.append(label, input);
        elements.passageFields.append(wrapper);
      });
    }

    function renderFormattedMessage() {
      const formatted = formatMessage();
      elements.outputText.value = formatted;
      elements.totalCharacters.textContent = formatted.length;
      elements.messageCount.textContent = Math.ceil(formatted.length / MESSAGE_LENGTH);
      renderCockpitDisplay(formatted);
    }

    function renderSetup() {
      elements.formSelect.value = String(state.formId);
      elements.platformSelect.value = String(state.platformId);
      elements.modeSelect.value = state.modeId;
      elements.prefixSelect.value = state.prefixId;
      elements.cockpitDisplay.style.setProperty("--chars-per-line", PLATFORM_DATA[state.platformId].charsPerLine);
      elements.cockpitDisplay.style.setProperty("--screen-lines", PLATFORM_DATA[state.platformId].screenLines);
      renderPassageFields();
      renderFormattedMessage();
    }

    elements.formSelect.addEventListener("change", (event) => {
      state.formId = Number(event.target.value);
      renderSetup();
    });

    elements.platformSelect.addEventListener("change", (event) => {
      state.platformId = Number(event.target.value);
      renderSetup();
    });

    elements.modeSelect.addEventListener("change", (event) => {
      state.modeId = event.target.value;
      renderFormattedMessage();
    });

    elements.prefixSelect.addEventListener("change", (event) => {
      state.prefixId = event.target.value;
      renderFormattedMessage();
    });

    elements.copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(elements.outputText.value);
        elements.copyButton.textContent = "Copied";
      } catch (error) {
        elements.outputText.focus();
        elements.outputText.select();
        elements.copyButton.textContent = document.execCommand("copy") ? "Copied" : "Select and copy";
      }
      window.setTimeout(() => {elements.copyButton.textContent = "Copy message";}, 1600);
    });

    elements.themeToggle.addEventListener("click", () => {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(nextTheme);
    });

    elements.addTab.addEventListener("click", () => {
      state.tabs.push(createTabState());
      renderTabs();
      activateTab(state.tabs.length - 1, true);
    });

    populateSelect(elements.formSelect, FORM_DATA);
    populateSelect(elements.platformSelect, PLATFORM_DATA);
    initializeTheme();
    renderTabs();
    renderSetup();
  </script>
</body>
</html>
